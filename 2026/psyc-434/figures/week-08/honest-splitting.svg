<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Top: bootstrap sample -->
  <rect x="240" y="20" width="280" height="50" rx="6" ry="6" fill="#f3efe6" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="50" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">Bootstrap sample for tree t (n rows)</text>

  <!-- Down-fork lines -->
  <line x1="380" y1="70" x2="380" y2="90" stroke="#333" stroke-width="1.5"/>
  <line x1="180" y1="90" x2="580" y2="90" stroke="#333" stroke-width="1.5"/>
  <line x1="180" y1="90" x2="180" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="90" x2="580" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Half A: split selection -->
  <rect x="40" y="125" width="280" height="220" rx="6" ry="6" fill="#dcebf3" stroke="#333" stroke-width="1.5"/>
  <text x="180" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Half A &#8211; chooses splits</text>
  <text x="180" y="170" text-anchor="middle" font-size="11" fill="#444">finds covariate cutpoints that</text>
  <text x="180" y="186" text-anchor="middle" font-size="11" fill="#444">separate treated from control</text>

  <!-- Mini tree (half A) -->
  <line x1="180" y1="210" x2="120" y2="245" stroke="#333" stroke-width="1.2"/>
  <line x1="180" y1="210" x2="240" y2="245" stroke="#333" stroke-width="1.2"/>
  <rect x="155" y="200" width="50" height="22" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="180" y="216" text-anchor="middle" font-size="11" fill="#222">X1 &#8804; a</text>

  <line x1="120" y1="265" x2="80" y2="305" stroke="#333" stroke-width="1.2"/>
  <line x1="120" y1="265" x2="160" y2="305" stroke="#333" stroke-width="1.2"/>
  <rect x="95" y="253" width="50" height="22" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="120" y="269" text-anchor="middle" font-size="11" fill="#222">X2 &#8804; b</text>

  <line x1="240" y1="265" x2="200" y2="305" stroke="#333" stroke-width="1.2"/>
  <line x1="240" y1="265" x2="280" y2="305" stroke="#333" stroke-width="1.2"/>
  <rect x="215" y="253" width="50" height="22" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="240" y="269" text-anchor="middle" font-size="11" fill="#222">X1 &#8804; c</text>

  <circle cx="80" cy="315" r="8" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <circle cx="160" cy="315" r="8" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <circle cx="200" cy="315" r="8" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <circle cx="280" cy="315" r="8" fill="#fff" stroke="#333" stroke-width="1.2"/>

  <text x="180" y="335" text-anchor="middle" font-size="10" font-style="italic" fill="#666">leaves are empty after splitting</text>

  <!-- Half B: leaf estimation -->
  <rect x="440" y="125" width="280" height="220" rx="6" ry="6" fill="#e6f0e0" stroke="#333" stroke-width="1.5"/>
  <text x="580" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Half B &#8211; estimates &#964; in each leaf</text>
  <text x="580" y="170" text-anchor="middle" font-size="11" fill="#444">routes its rows down the tree</text>
  <text x="580" y="186" text-anchor="middle" font-size="11" fill="#444">computes treated &#8722; control per leaf</text>

  <!-- Mini tree (half B) -->
  <line x1="580" y1="210" x2="520" y2="245" stroke="#333" stroke-width="1.2"/>
  <line x1="580" y1="210" x2="640" y2="245" stroke="#333" stroke-width="1.2"/>
  <rect x="555" y="200" width="50" height="22" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="580" y="216" text-anchor="middle" font-size="11" fill="#222">X1 &#8804; a</text>

  <line x1="520" y1="265" x2="480" y2="305" stroke="#333" stroke-width="1.2"/>
  <line x1="520" y1="265" x2="560" y2="305" stroke="#333" stroke-width="1.2"/>
  <rect x="495" y="253" width="50" height="22" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="520" y="269" text-anchor="middle" font-size="11" fill="#222">X2 &#8804; b</text>

  <line x1="640" y1="265" x2="600" y2="305" stroke="#333" stroke-width="1.2"/>
  <line x1="640" y1="265" x2="680" y2="305" stroke="#333" stroke-width="1.2"/>
  <rect x="615" y="253" width="50" height="22" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="640" y="269" text-anchor="middle" font-size="11" fill="#222">X1 &#8804; c</text>

  <circle cx="480" cy="315" r="11" fill="#dcebf3" stroke="#333" stroke-width="1.2"/>
  <text x="480" y="319" text-anchor="middle" font-size="9" fill="#222">+0.4</text>
  <circle cx="560" cy="315" r="11" fill="#dcebf3" stroke="#333" stroke-width="1.2"/>
  <text x="560" y="319" text-anchor="middle" font-size="9" fill="#222">&#8722;0.1</text>
  <circle cx="600" cy="315" r="11" fill="#dcebf3" stroke="#333" stroke-width="1.2"/>
  <text x="600" y="319" text-anchor="middle" font-size="9" fill="#222">+0.2</text>
  <circle cx="680" cy="315" r="11" fill="#dcebf3" stroke="#333" stroke-width="1.2"/>
  <text x="680" y="319" text-anchor="middle" font-size="9" fill="#222">+0.6</text>

  <text x="580" y="335" text-anchor="middle" font-size="10" font-style="italic" fill="#666">leaves now hold &#964;-estimates</text>

  <!-- Bridge text -->
  <text x="380" y="375" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">No row appears in both halves.</text>
  <text x="380" y="395" text-anchor="middle" font-size="11" fill="#444">The split-selection step cannot inflate the gap that the estimation step measures.</text>
</svg>
